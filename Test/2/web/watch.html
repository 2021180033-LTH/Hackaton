<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영상 시청 — Forensic G</title><link rel="stylesheet" href="/style.css"><script src="/watch.js" defer></script></head>
<body class="viewer-body"><main class="viewer-main"><div class="viewer-brand"><span class="logo">G</span><b>FORENSIC_G</b><span class="pill">VIEWER</span></div><div class="card"><span class="eyebrow">WATCH / 개인 재생 세션</span><h1 id="watch-title">영상을 불러오는 중</h1><p id="watch-meta"></p><video id="watch-video" controls playsinline preload="none"></video><div id="watch-error" class="error" role="alert" hidden></div><div class="viewer-actions"><button id="start-playback" class="primary" disabled>재생 준비 후 시청 →</button><button id="new-session" class="secondary" hidden>새 재생 세션</button><a id="viewer-download" class="text-link" hidden>현재 시청 사본 저장 ↗</a></div><div id="watch-job" class="job" role="status" aria-live="polite" hidden><strong id="watch-status">재생 사본 준비 중</strong><progress id="watch-progress" max="100" value="0"></progress><p id="watch-message"></p></div><p id="session-info" class="hint"></p><div class="notice">재생 요청 시 이 접속의 IP와 임의의 시청 세션 번호를 기록하고, 해당 세션용 영상 사본을 제공합니다. 로그인 신원이나 물리적인 기기를 확인하는 기능은 아닙니다.</div></div><footer>Forensic G / 시청자용 데모<span>원본 파일은 이 페이지에서 제공하지 않습니다.</span></footer></main></body></html>
